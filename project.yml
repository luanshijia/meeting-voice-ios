name: MeetingVoice
options:
  bundleIdPrefix: com.luanshijia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# 用官方「源码包」而不是「预编译包」:预编译包声明 swift-tools-version:6.2,
# 需要 Xcode 26;CI 的 macos-15 runner 是 Xcode 16.4(只到 Swift 6.1),会被解析器直接拒绝
# (实测报错:Dependencies could not be resolved because ... incompatible tools version (6.2.0))。
# 源码包声明 swift-tools-version:6.1(包内注释写明 "Xcode16.3+"),当前 runner 可用。
# 代价:CI 里要现编 SDK(慢一些);换来的是不依赖 Xcode 26。
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.17.0"

targets:
  # 广播扩展(阶段二前置探针):只记录「对方声音 / 我方麦克风」的计数与采样格式,
  # 不做任何传输、不依赖 LiveKit —— 探针要把变量压到最少。
  # 单独做一个 target 的真正意义:让「带 appex 的包」真的被签一次,回答
  # 「免费自签能不能把带扩展的包装进手机」这个阶段二最大未知。
  MeetingVoiceBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
    info:
      path: Broadcast/Info.plist
      properties:
        # 必须是纯 ASCII:SideStore 给扩展注册 App ID 时会拼出
        # "<App 显示名> <扩展显示名>" 当 appIdName,中文/非 ASCII 会被 Apple 直接拒绝
        # (实测报错:An invalid value 'MeetingVoice MeetingVoice 广播' was provided
        #   for the parameter 'appIdName'.)→ 改成 ASCII 才能走「每个扩展注册 App ID」这条路。
        CFBundleDisplayName: MeetingVoiceBroadcast
        CFBundleShortVersionString: "0.3.3"
        CFBundleVersion: "15"
        # 必须写在 properties 里:XcodeGen 会用这里的属性【覆盖】path 指向的 Info.plist,
        # 只写在文件里会被覆盖掉(实测:CI 报 "NSExtension:NSExtensionPointIdentifier Does Not Exist")
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
        # 扩展自己要用 https 连回家里(回信道 ②):给本地网络权限说明
        NSLocalNetworkUsageDescription: 连接你家里的转写服务(xEdge 私网)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanshijia.meetingvoice.broadcast
        PRODUCT_NAME: MeetingVoiceBroadcast
        MARKETING_VERSION: "0.3.3"
        CURRENT_PROJECT_VERSION: "15"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # App Group:主 App 与扩展共享容器(探针日志走这里读回)
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

  MeetingVoice:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: LiveKit
        product: LiveKit
      # 扩展嵌进 PlugIns/;不签名 —— 侧载时由 SideStore 一起重签
      - target: MeetingVoiceBroadcast
        embed: true
        codeSign: false
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: MeetingVoice
        # 必须写成带引号的字符串:YAML 会把 6 当数字,CFNetwork 拼 User-Agent 时
        # 拿到数字会抛异常直接 abort(实测崩溃栈:initializeUserAgentString)
        CFBundleShortVersionString: "0.3.3"
        CFBundleVersion: "15"
        UILaunchScreen: {}
        # 锁屏/后台继续录音的关键:后台音频模式
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: 用于会议录音与实时转写
        # 走 wss:// + 自家 CA 签发的证书,ATS 保持 iOS 默认的严格策略(不加任何豁免)。
        NSLocalNetworkUsageDescription: 连接你家里的转写服务(xEdge 私网)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanshijia.meetingvoice
        PRODUCT_NAME: MeetingVoice
        MARKETING_VERSION: "0.3.3"
        CURRENT_PROJECT_VERSION: "15"
        SWIFT_VERSION: "5.0"
        # 显式锁定:接 SwiftPM 依赖后产物 Info.plist 的 MinimumOSVersion 曾变成 13.0(依赖的声明下限),
        # 而代码用了 iOS 17 的 API —— 写死避免漂移。
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # App Group:与广播扩展共享容器
        CODE_SIGN_ENTITLEMENTS: Support/MeetingVoice.entitlements
        # 纯验证 CI 出包通路:不签名
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
