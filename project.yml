name: MeetingVoice
options:
  bundleIdPrefix: com.luanshijia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MeetingVoice:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanshijia.meetingvoice
        PRODUCT_NAME: MeetingVoice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MeetingVoice
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于会议录音与实时转写
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # 纯验证 CI 出包通路:不签名
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
