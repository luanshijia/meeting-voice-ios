name: MeetingVoice
options:
  bundleIdPrefix: com.luanshijia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MeetingVoice:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: MeetingVoice
        # 必须写成带引号的字符串:YAML 会把 6 当数字,CFNetwork 拼 User-Agent 时
        # 拿到数字会抛异常直接 abort(实测崩溃栈:initializeUserAgentString)
        CFBundleShortVersionString: "0.1.3"
        CFBundleVersion: "8"
        UILaunchScreen: {}
        # 锁屏/后台继续录音的关键:后台音频模式
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: 用于会议录音与实时转写
        # 走 wss:// + 自家 CA 签发的证书,ATS 保持 iOS 默认的严格策略(不加任何豁免)。
        NSLocalNetworkUsageDescription: 连接你家里的转写服务(xEdge 私网)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanshijia.meetingvoice
        PRODUCT_NAME: MeetingVoice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # 纯验证 CI 出包通路:不签名
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
