name: MeetingVoice
options:
  bundleIdPrefix: com.luanshijia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MeetingVoice:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: MeetingVoice
        UILaunchScreen: {}
        # 锁屏/后台继续录音的关键:后台音频模式
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: 用于会议录音与实时转写
        # iOS 默认禁止明文 ws://(ATS)。我们的转写服务在 xEdge 私网里、没有 TLS 证书,
        # 所以这里放开:自签自用的 App,不上架,风险面就是"家里私网这一条链路"。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 连接你家里的转写服务(xEdge 私网)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanshijia.meetingvoice
        PRODUCT_NAME: MeetingVoice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # 纯验证 CI 出包通路:不签名
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
